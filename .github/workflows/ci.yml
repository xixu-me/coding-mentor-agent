name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build sandbox runner
        run: docker build -t coding-mentor-python-runner:0.1.0 -f sandbox-runner.Dockerfile .
      - name: Type-check
        run: npm run lint
      - name: Run tests including real sandbox isolation
        run: npm test
      - name: Build frontend
        run: npm run build
